<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">NZ Vehicle Market Tracker architecture</title>
  <desc id="arch-desc">NZTA all-vehicle-years ZIP feeds a streaming Python pipeline that writes validated aggregate JSON, which the static React dashboard reads. A daily metadata check refreshes the pipeline only when the release changes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#52525b" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="674" rx="16" fill="#0b0b0e" stroke="#27272a" />

  <text x="60" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#f4f4f5">How the data reaches the dashboard</text>
  <text x="60" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#71717a">Automated, from NZTA open data</text>

  <!-- Box 1 -->
  <rect x="60" y="190" width="234" height="150" rx="14" fill="#101013" stroke="#3f3f46" />
  <text x="82" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#e4e4e7">NZTA release</text>
  <text x="82" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">Multi-gigabyte</text>
  <text x="82" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">all-vehicle-years ZIP</text>

  <!-- Box 2 -->
  <rect x="342" y="190" width="234" height="150" rx="14" fill="#101013" stroke="#3f3f46" />
  <text x="364" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#e4e4e7">Streaming Python</text>
  <text x="364" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">Selects analytical</text>
  <text x="364" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">columns and validates</text>

  <!-- Box 3 -->
  <rect x="624" y="190" width="234" height="150" rx="14" fill="#101013" stroke="#3f3f46" />
  <text x="646" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#e4e4e7">Aggregate JSON</text>
  <text x="646" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">Small, versioned,</text>
  <text x="646" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">checksummed in repo</text>

  <!-- Box 4 -->
  <rect x="906" y="190" width="234" height="150" rx="14" fill="#101013" stroke="#3f3f46" />
  <text x="928" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#e4e4e7">React dashboard</text>
  <text x="928" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">Static front end,</text>
  <text x="928" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">no backend or database</text>

  <!-- Arrows -->
  <line x1="298" y1="265" x2="334" y2="265" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="580" y1="265" x2="616" y2="265" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="862" y1="265" x2="898" y2="265" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- CI badge under box 2 -->
  <rect x="342" y="356" width="234" height="36" rx="10" fill="#18181b" stroke="#27272a" />
  <text x="459" y="379" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">pytest · Ruff · CodeQL</text>

  <!-- Deploy badge under box 4 -->
  <rect x="906" y="356" width="234" height="36" rx="10" fill="#18181b" stroke="#27272a" />
  <text x="1023" y="379" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">Deployed to GitHub Pages</text>

  <!-- Feedback loop -->
  <rect x="342" y="440" width="516" height="96" rx="14" fill="#101013" stroke="#3f3f46" />
  <text x="364" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#e4e4e7">Daily metadata check</text>
  <text x="364" y="506" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">Checks URL, ETag, last-modified and size before downloading,</text>
  <text x="364" y="526" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#a1a1aa">so unchanged releases cost nothing</text>

  <path d="M342 488 H177 V348" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 7" stroke-linejoin="round" marker-end="url(#arrow-accent)" />

  <text x="60" y="620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#71717a">No backend, database or user accounts. Raw vehicle-level data is never deployed.</text>
</svg>
